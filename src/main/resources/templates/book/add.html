<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{common :: meta_header('書籍登録',~{::link},~{::script})}">
    <title th:text="${title}+' | MTLibrary'"></title>
    <link rel="stylesheet" th:href="@{/css/book/add.css}" />
    <script type="text/javascript" th:src="@{/js/book/add.js}"></script>
</head>

<body>
    <div class="contents">
        <div th:replace="~{common :: main_sidebar}"></div>
        <div class="main_contents">
            <div th:replace="~{common :: header}"></div>
            <div class="inner_contens">
                
                <div class="page_title">書籍登録</div>
                <div class="page_contents">
                    <form id="book_register_form" th:object="${bookMstDto}" th:action="@{/book/add}" method="post">
                        
                        <h4 style="color:red">*は必須項目です</h4>
                        <span>
                            <div class="back_link">
                            <a th:href="@{/book/index}" class="link">← 一覧へ戻る</a>
                            </div>
                        </span>
                    <p>
                        <label>書籍名<span class="asterisk">*</span></label><br>
                        <input type = "text"th:field="*{title}"placeholder="書籍名を入力"class="form_input"/>
                        <div th:if = "${errTitleList}">
                            <ul>
                                <li th:each = "msg :${errTitleList}" th:text="${msg}" style="color:red"></li>
                            </ul>
                        </div>
                     </p>
                     <p>
                        <label>ISBN<span class="asterisk">*</span></label><br>
                        <input type = "text" th:field="*{isbn}"placeholder="ISBNを入力" class="form_input">
                        <div th:if = "${errIsbnList}">
                            <ul>
                                <li th:each = "msg :${errIsbnList}" th:text="${msg}" style="color:red"></li>
                            </ul>
                        </div>
                    </p>
                        
                    <div class="btn_block">
                        <button type = "submit"id="submit_btn">保存</button>
                    </div>
                        
                        <div class="mb30 flexarea">
                           
                            

                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{common :: footer}"></div>
</body>
